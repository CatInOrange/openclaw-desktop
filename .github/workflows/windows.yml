name: Windows portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Non-GUI checks
        shell: pwsh
        run: |
          Get-ChildItem src -File | Where-Object { $_.Extension -in '.cjs', '.js' } | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/personal-sign.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify portable replacement and rollback (non-GUI)
        shell: powershell
        run: ./scripts/test-portable-update.ps1
      - name: Package Windows x64 portable
        run: npm run dist:win -- --publish never
      - name: Verify packaged media and runtime (non-GUI)
        run: node scripts/verify-package.cjs dist/win-unpacked/resources
      - name: Verify personal signing on a disposable copy (non-GUI)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $signTest = Join-Path $env:RUNNER_TEMP 'personal-sign-test'
          New-Item -ItemType Directory -Path $signTest -Force | Out-Null
          $probe = Join-Path $signTest 'probe.exe'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item "dist/OpenClaw-Desktop-$version-win-x64.exe" $probe
          $hash = (Get-FileHash $probe -Algorithm SHA256).Hash
          $signState = Join-Path $signTest 'state'
          try {
            # CurrentUser Root import requires human consent. Do not exercise that
            # interactive path on a headless runner. Trust only this disposable
            # certificate in the runner's machine Root store for verification.
            & ./scripts/personal-sign.ps1 -ExePath $probe -ExpectedSha256 $hash -StateDirectory $signState
            Import-Certificate -FilePath (Join-Path $signState 'OpenClaw-Desktop-Personal.cer') -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
            $signature = Get-AuthenticodeSignature (Join-Path $signTest 'probe.personal.exe')
            if ($signature.Status -ne 'Valid') { throw "Test signature status: $($signature.Status)" }
            if ((Get-FileHash $probe -Algorithm SHA256).Hash -ne $hash) { throw 'Original EXE changed' }
          } finally {
            $thumbFile = Join-Path $signState 'signer-thumbprint.txt'
            if (Test-Path $thumbFile) {
              $thumb = (Get-Content $thumbFile -Raw).Trim()
              foreach ($storePath in @('CurrentUser\My', 'LocalMachine\Root')) {
                $certPath = "Cert:\$storePath\$thumb"
                if (Test-Path $certPath) { Remove-Item $certPath -Force }
              }
            }
          }
      - name: Create checksums and include quick-start
        shell: pwsh
        run: |
          Copy-Item TRY-WINDOWS.md dist/TRY-WINDOWS.md
          Copy-Item README.md dist/README.md
          Copy-Item docs/PERSONAL-SIGNING.md dist/PERSONAL-SIGNING.md
          Copy-Item docs/UPDATES.md dist/UPDATES.md
          Copy-Item scripts/personal-sign.ps1 dist/personal-sign.ps1
          Get-ChildItem dist -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS -Encoding ascii
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path "dist/OpenClaw-Desktop-$version-win-x64.exe")) { throw 'Expected portable EXE missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Desktop-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS
            dist/TRY-WINDOWS.md
            dist/README.md
            dist/PERSONAL-SIGNING.md
            dist/personal-sign.ps1
            dist/UPDATES.md
          if-no-files-found: error
      - name: Publish tagged preview
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --prerelease --title "OpenClaw Desktop $env:GITHUB_REF_NAME Preview" --notes-file RELEASE-NOTES.md dist/*.exe dist/SHA256SUMS dist/TRY-WINDOWS.md dist/README.md dist/PERSONAL-SIGNING.md dist/personal-sign.ps1 dist/UPDATES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
