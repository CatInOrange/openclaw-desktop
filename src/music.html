<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src https:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>心动音乐</title><link rel="stylesheet" href="music.css"></head>
<body>
<nav aria-label="音乐控制" id="strip">
<button id="toggle" title="播放 / 暂停" aria-label="播放">▶</button>
<button id="like" title="喜欢" aria-label="喜欢" aria-pressed="false">♡</button>
<button id="next" title="下一首" aria-label="下一首">⏭</button>
<button id="panel" title="展开音乐面板" aria-label="展开音乐面板" aria-expanded="false">⌄</button>
</nav>
<section id="card" hidden aria-label="心动音乐">
<header><span>心动音乐</span><small>网易云音乐</small></header>
<h1 id="name">还没有播放歌曲</h1><p id="artist"></p>
<p id="status" role="status" aria-live="polite"></p>
<img id="qr" alt="使用网易云音乐 App 扫码登录" hidden>
<div class="account"><button id="login">扫码登录</button><button id="logout" hidden>退出登录</button></div>
<p class="note">基于红心歌单的心动模式 · 自动连续播放</p>
</section><audio id="audio" preload="auto"></audio>
<script src="music.js"></script></body></html>
