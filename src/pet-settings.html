<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'"><title>桌宠设置</title><link rel="stylesheet" href="pet-settings.css"></head><body><main><p class="eyebrow">DESKTOP COMPANION</p><h1>桌宠设置</h1><p class="muted">只影响这台电脑，调整后立即生效。</p><section><label class="row"><span>显示桌宠<small>隐藏后仍可从托盘打开此页面</small></span><input id="enabled" type="checkbox" role="switch"></label><label for="size" class="row"><span>角色大小</span><output id="size-value">100%</output></label><input id="size" type="range" min="160" max="720" step="1" value="462"><p class="muted">拖动滑块实时缩放；100% 为原版默认大小。</p></section><section><label class="row"><span>始终置顶<small>让角色显示在其他普通窗口上方</small></span><input id="top" type="checkbox" role="switch"></label><label class="row"><span>空闲时走动<small>仅在确认空闲时走动，工作或拖拽时停止</small></span><input id="roaming" type="checkbox" role="switch"></label></section><footer><button id="reset">恢复默认</button><button id="done">完成</button></footer><p id="save-status" role="status">设置自动保存到本机</p></main><script src="pet-settings.js"></script></body></html>
